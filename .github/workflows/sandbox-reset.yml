# Wipe sandbox puntual (Kapso + conversations).
# NO usar en permanente: el auto-reset cada 20 min está apagado a propósito.
# Encender solo si alguien pide wipe, y dejar SANDBOX_RESET_ENABLED=false después.
name: Sandbox reset

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call sandbox-reset
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "Missing CRON_SECRET repo secret" >&2
            exit 1
          fi
          # max-time evita colgar 15m si Vercel/Kapso no responde
          curl -sS -f --connect-timeout 10 --max-time 90 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://tool-coolmeals-api-ten.vercel.app/api/cron/sandbox-reset" \
            | tee /tmp/sandbox-reset.json
          python3 - <<'PY'
          import json, sys
          data = json.load(open("/tmp/sandbox-reset.json"))
          payload = data.get("data", data)
          if payload.get("enabled") is False and payload.get("skippedReason"):
              print("skipped:", payload["skippedReason"])
              sys.exit(0)
          if "error" in data:
              print(data)
              sys.exit(1)
          print("ok:", json.dumps(payload, ensure_ascii=False)[:800])
          PY
